<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>OC FAST 5.0 — MODELOS INTELIGENTES</title>
  <style>
    :root {
      --bg: #101212;
      --panel: #171b1b;
      --panel2: #202525;
      --line: #303737;
      --green: #35c46b;
      --green2: #1d8e4b;
      --text: #eeeeee;
      --muted: #929999;
      --paper: #e9dfbd;
      --paper2: #dfd2a9;
      --ink: #25251f;
      --danger: #d84b4b;
    }

    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #202626 0%, #101212 55%);
      color: var(--text);
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: relative;
      height: 66px;
      flex: 0 0 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      background: #111515;
      border-bottom: 1px solid #2c3333;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brandMark {
      width: 35px;
      height: 35px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--green);
      border: 1px solid #30453a;
      font-weight: 900;
    }
    .brandText {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1px;
    }
    .brandText small {
      display: block;
      margin-top: 2px;
      color: #69716f;
      font-size: 9px;
      letter-spacing: 0.8px;
    }
    .topCenter {
      position: absolute;
      left: 50%;
      transform: translate(-50%, -50%);
      top: 50%;
      z-index: 2;
      pointer-events: none;
      text-align: center;
    }
    #clock {
      color: var(--green);
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1px;
    }
    #topDate {
      color: #7f8986;
      font-size: 10px;
      margin-top: 2px;
    }
    .windowBtns {
      display: flex;
      gap: 6px;
    }
    .windowBtns button {
      width: 34px;
      height: 31px;
      border: 1px solid #303838;
      border-radius: 7px;
      background: #1b2020;
      color: #ddd;
      cursor: pointer;
    }
    .windowBtns button:hover {
      border-color: var(--green);
      color: var(--green);
    }
    .windowBtns .close:hover {
      border-color: var(--danger);
      color: #ff7777;
    }

    .main {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      gap: 12px;
      padding: 12px;
    }
    .left {
      min-height: 0;
      overflow: auto;
      padding-right: 2px;
    }
    .right {
      min-width: 0;
      min-height: 0;
    }

    .card {
      background: linear-gradient(145deg, #191e1e, #131717);
      border: 1px solid #2d3535;
      border-radius: 13px;
      padding: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.16);
      margin-bottom: 10px;
    }
    .cardTitle {
      font-size: 10px;
      color: #77817e;
      font-weight: 900;
      letter-spacing: 1.2px;
      margin-bottom: 9px;
    }
    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .field {
      margin-bottom: 8px;
    }
    .field label {
      display: block;
      margin-bottom: 4px;
      color: #8e9794;
      font-size: 9px;
      font-weight: 900;
      text-transform: uppercase;
    }
    input, select, textarea {
      width: 100%;
      border: 1px solid #303939;
      border-radius: 8px;
      outline: none;
      background: #0f1313;
      color: #f0f0f0;
      font-family: inherit;
      font-size: 13px;
    }
    input, select {
      height: 37px;
      padding: 0 9px;
    }
    textarea {
      min-height: 90px;
      resize: vertical;
      padding: 9px;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 2px rgba(53,196,107,.08);
    }
    .rowNow {
      display: grid;
      grid-template-columns: 1fr 48px;
      gap: 5px;
      align-items: end;
    }
    .nowBtn {
      border: 1px solid #31513d;
      border-radius: 8px;
      background: #142119;
      color: var(--green);
      font-size: 9px;
      font-weight: 900;
      cursor: pointer;
      min-height: 37px;
    }
    .nowBtn:hover { background: #1a3022; }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-top: 8px;
    }
    .btn {
      min-height: 39px;
      border: 1px solid #343d3d;
      border-radius: 8px;
      background: #202626;
      color: #eee;
      font-size: 10px;
      font-weight: 900;
      cursor: pointer;
      transition: .12s;
    }
    .btn:hover {
      transform: translateY(-1px);
      border-color: #53605c;
    }
    .btn.green {
      background: var(--green);
      color: #07130c;
      border-color: var(--green);
    }
    .btn.green:hover { filter: brightness(1.08); }
    .btn.danger { color: #ff8a8a; }
    .btn.full { width: 100%; }
    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 8px;
      border-radius: 8px;
      background: #111616;
      border: 1px solid #293131;
      font-size: 9px;
      color: #87908d;
    }
    .statusDot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 10px rgba(53,196,107,.55);
    }
    #closedBadge { color: #ff8888; }
    .hidden { display: none !important; }

    .bookShell {
      height: 100%;
      min-height: 0;
      border: 1px solid #303532;
      border-radius: 14px;
      overflow: hidden;
      background: #111515;
      box-shadow: 0 15px 45px rgba(0,0,0,.28);
    }
    .bookHeader {
      height: 64px;
      padding: 9px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #171c1c;
      border-bottom: 1px solid #2c3333;
    }
    .bookTitle {
      font-weight: 900;
      letter-spacing: 1px;
      font-size: 13px;
    }
    .bookTitle small {
      display: block;
      color: #6e7774;
      font-size: 9px;
      margin-top: 4px;
    }
    .bookTools { display: flex; gap: 6px; }
    .bookTools button {
      border: 1px solid #35403b;
      border-radius: 7px;
      background: #18201d;
      color: var(--green);
      padding: 8px 10px;
      font-size: 9px;
      font-weight: 900;
      cursor: pointer;
    }
    .bookScroll {
      height: calc(100% - 64px);
      overflow-y: auto;
      overflow-x: hidden;
      padding: 24px;
      background: #080b0b;
    }
    .paper {
      min-height: 100%;
      padding: 40px 48px 70px;
      background: repeating-linear-gradient(0deg, rgba(100,80,30,.025) 0px, rgba(100,80,30,.025) 1px, transparent 1px, transparent 4px), repeating-linear-gradient(90deg, rgba(100,80,30,.018) 0px, rgba(100,80,30,.018) 1px, transparent 1px, transparent 5px), var(--paper);
      color: var(--ink);
      box-shadow: 0 12px 30px rgba(0,0,0,.32), inset 0 0 45px rgba(80,60,20,.08);
      border-radius: 2px;
    }
    .paperHeader {
      text-align: center;
      padding-bottom: 22px;
      margin-bottom: 25px;
      border-bottom: 1px solid rgba(50,45,30,.35);
    }
    .paperHeader strong { font-size: 16px; letter-spacing: 1.2px; }
    .paperHeader small {
      display: block;
      margin-top: 6px;
      font-size: 10px;
      opacity: .65;
    }
    .opening {
      white-space: pre-wrap;
      font-family: "Courier New", monospace;
      font-size: 14px;
      line-height: 1.55;
      padding-bottom: 25px;
      border-bottom: 1px dashed rgba(70,60,35,.38);
      outline: none;
    }
    .opening[contenteditable="true"]:focus { box-shadow: 0 0 0 2px rgba(53,196,107,.12); }
    .entry {
      position: relative;
      padding: 24px 0;
      border-bottom: 1px dashed rgba(70,60,35,.38);
      scroll-margin-top: 20px;
    }
    .entry.justAdded { animation: addedFlash 1.5s ease; }
    @keyframes addedFlash {
      0% { background: rgba(53,196,107,.18); }
      100% { background: transparent; }
    }
    .entryText {
      white-space: pre-wrap;
      font-family: "Courier New", monospace;
      font-size: 14px;
      line-height: 1.55;
      outline: none;
      border-radius: 4px;
      padding: 3px;
      min-height: 24px;
    }
    .entryText[contenteditable="true"]:focus { box-shadow: 0 0 0 2px rgba(53,196,107,.12); }
    .entryText[contenteditable="true"] { cursor: text; }
    .entryActions {
      display: flex;
      justify-content: flex-end;
      gap: 5px;
      margin-top: 13px;
      padding-top: 9px;
      border-top: 1px solid rgba(70,60,35,.18);
    }
    .entryActions button {
      border: 1px solid rgba(60,55,40,.35);
      border-radius: 6px;
      background: rgba(255,255,255,.2);
      color: #444133;
      padding: 5px 8px;
      font-size: 8px;
      font-weight: 900;
      cursor: pointer;
    }
    .entryActions button:hover { background: rgba(255,255,255,.45); }
    .entryActions button:last-child { color: #a33e3e; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translate(-50%, 20px);
      z-index: 999999;
      padding: 10px 15px;
      border-radius: 9px;
      background: #202727;
      border: 1px solid #3b4944;
      color: #fff;
      font-size: 11px;
      opacity: 0;
      pointer-events: none;
      transition: .2s;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 50000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 15px;
      background: rgba(0,0,0,.7);
      backdrop-filter: blur(3px);
    }
    .modal.show { display: flex; }
    .modalBox {
      width: min(600px, 96vw);
      max-height: 90vh;
      overflow: auto;
      border: 1px solid #34403a;
      border-radius: 15px;
      background: #171c1c;
      box-shadow: 0 25px 80px rgba(0,0,0,.55);
      padding: 16px;
    }
    .modalTitle {
      font-size: 14px;
      font-weight: 900;
      margin-bottom: 13px;
    }
    .qtyGrid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }
    .modalActions {
      display: flex;
      gap: 7px;
      margin-top: 14px;
    }
    .modalActions .btn { flex: 1; }

    .quickTimePicker {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }
    .quickTimePicker select {
      width: 100%;
      min-height: 40px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 9px;
      background: #111;
      color: #f2f2f2;
      padding: 8px 9px;
      font-size: 16px;
      font-weight: 800;
      outline: none;
    }
    .quickTimePicker select:focus {
      border-color: #32c875;
      box-shadow: 0 0 0 2px rgba(50,200,117,.13);
    }
    .quickTimePicker select option { background: #111; color: #fff; }
    .quickTimeLabel {
      display: block;
      font-size: 9px;
      line-height: 1;
      opacity: .58;
      margin-bottom: 3px;
      letter-spacing: .6px;
    }
    .quickTimePart { min-width: 0; }

    .flashTopAction {
      display: flex;
      align-items: center;
      margin-left: auto;
      margin-right: 8px;
    }
    .flashTopAction button {
      height: 34px;
      border: 1px solid #31513d;
      border-radius: 8px;
      background: #142119;
      color: #79e49b;
      font-size: 9px;
      font-weight: 900;
      padding: 0 11px;
      cursor: pointer;
      transition: .12s;
    }
    .flashTopAction button:hover {
      transform: translateY(-1px);
      border-color: #4fbc75;
      background: #183022;
    }
    .flashTopAction button:active { transform: scale(.97); }

    .flashModal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.72);
      z-index: 5000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .flashModal.show { display: flex; }
    .flashWindow {
      width: min(760px, 100%);
      max-height: calc(100vh - 28px);
      background: #111615;
      border: 1px solid #34413b;
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0,0,0,.55);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .flashHead {
      height: 50px;
      flex: 0 0 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid #2b3431;
      background: #171d1b;
    }
    .flashHead strong { font-size: 12px; letter-spacing: 1px; color: #e6ece9; }
    .flashHead small {
      display: block;
      color: #718079;
      font-size: 7px;
      margin-top: 2px;
    }
    .flashClose {
      width: 32px;
      height: 32px;
      border: 1px solid #39433f;
      border-radius: 8px;
      background: #202624;
      color: #e4e8e6;
      font-size: 18px;
      cursor: pointer;
    }
    .flashBody {
      overflow: auto;
      padding: 10px;
    }
    .modelList {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }
    .modelCardItem {
      border: 1px solid #2d3934;
      background: #141b19;
      border-radius: 10px;
      padding: 10px;
      position: relative;
    }
    .modelCardItem strong {
      display: block;
      font-size: 11px;
      margin-bottom: 4px;
      color: #edf5f1;
    }
    .modelCardItem small {
      display: block;
      color: #76827e;
      margin-bottom: 8px;
      font-size: 8px;
    }
    .modelCardActions {
      display: flex;
      gap: 6px;
    }
    .modelCardActions button {
      flex: 1;
      min-height: 28px;
      border-radius: 7px;
      border: 1px solid #2f3d37;
      background: #1c2622;
      color: #dfeae5;
      font-size: 8px;
      font-weight: 900;
      cursor: pointer;
    }
    .modelCardActions .danger { border-color: #493838; color: #ff8d8d; }
    .flashForm {
      background: #151b19;
      border: 1px solid #2e3934;
      border-radius: 10px;
      padding: 10px;
      margin-top: 12px;
    }
    .flashForm label {
      display: block;
      font-size: 8px;
      font-weight: 900;
      margin-bottom: 6px;
      color: #b8c3be;
      text-transform: uppercase;
    }
    .flashForm input, .flashForm textarea {
      width: 100%;
      background: #0d1111;
      border: 1px solid #2f3937;
      border-radius: 8px;
      color: #eef4f1;
      padding: 8px;
      font-family: inherit;
    }
    .flashForm textarea {
      min-height: 120px;
      resize: vertical;
      margin-top: 8px;
    }
    .flashTools {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .flashTools .btn {
      flex: 1;
      min-width: 145px;
    }

    .hiddenForm { display: none; }

    @media (max-width: 850px) {
      html, body { overflow: hidden; }
      .topbar { height: 58px; flex-basis: 58px; }
      .brandText { display: none; }
      #clock { font-size: 17px; }
      .topCenter { left: 50%; }
      .main {
        grid-template-columns: 1fr;
        gap: 8px;
        padding: 8px;
      }
      .left {
        overflow: auto;
        max-height: 47vh;
      }
      .right { min-height: 53vh; }
      .bookScroll { padding: 10px; }
      .paper { padding: 25px 20px 50px; }
      .bookHeader { height: 55px; }
      .bookScroll { height: calc(100% - 55px); }
      .qtyGrid { grid-template-columns: repeat(2, 1fr); }
      .quickTimePicker select { min-height: 42px; font-size: 17px; }
    }

    @media (max-width: 500px) {
      .topCenter { transform: translate(-50%, -50%) scale(.92); }
      .windowBtns button { width: 29px; }
      .main { padding: 5px; }
      .left { max-height: 50vh; }
      .right { min-height: 50vh; }
      .paper { padding: 22px 15px 45px; }
      .entryText, .opening { font-size: 12px; }
      .bookTools button { padding: 7px; }
      .modelList { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brandMark">OC</div>
        <div class="brandText">OC FAST<small>LIVRO DIÁRIO</small></div>
      </div>
      <div class="topCenter">
        <div id="clock">00:00:00</div>
        <div id="topDate">00/00/0000</div>
      </div>
      <div class="flashTopAction">
        <button id="ocFlashBtn" type="button" title="Abrir OC FLASH">OC FLASH</button>
      </div>
      <div class="windowBtns">
        <button id="fsBtn" type="button" title="Tela cheia">□</button>
        <button id="minBtn" type="button" title="Minimizar">_</button>
        <button id="closeBtn" class="close" type="button" title="Fechar">✕</button>
      </div>
    </header>

    <main class="main">
      <aside class="left">
        <div class="card">
          <div class="cardTitle">CONFIGURAÇÃO</div>

          <div class="grid2">
            <div class="field">
              <label>Hora inicial</label>
              <div class="rowNow">
                <input id="startTime" type="time" value="" data-next="dateInput" />
                <button class="nowBtn" id="nowStart" type="button">AGORA</button>
              </div>
            </div>
            <div class="field">
              <label>Data</label>
              <input id="dateInput" type="date" value="" data-next="service" />
            </div>
          </div>

          <div class="field">
            <label>Serviço</label>
            <select id="service" data-next="gallery">
              <option value="vasilhames">Recolhimento de vasilhames</option>
              <option value="lixo">Recolhimento de lixo</option>
              <option value="alimentacao">Fornecimento de alimentação</option>
              <option value="medicacao">Fornecimento de medicação</option>
              <option value="curso">Retirada de internos para curso</option>
              <option value="psico">Atendimento psicólogo</option>
              <option value="medico">Atendimento médico</option>
              <option value="advogado">Atendimento com advogado</option>
              <option value="nominal">Conferir nominal</option>
              <option value="outro">Outro serviço</option>
            </select>
          </div>

          <div class="field">
            <label>Galeria</label>
            <input id="gallery" type="text" placeholder="Ex.: C" data-next="monitors" />
          </div>

          <div class="field">
            <label>Monitores</label>
            <input id="monitors" type="text" placeholder="Ex.: WILLIAN" data-next="lawyer" />
          </div>

          <div class="field">
            <label>Advogado</label>
            <input id="lawyer" type="text" data-next="oab" />
          </div>

          <div class="field">
            <label>OAB</label>
            <input id="oab" type="text" data-next="course" />
          </div>

          <div class="field">
            <label>Local / Curso</label>
            <input id="course" type="text" data-next="desc" />
          </div>

          <div class="field">
            <label>Descrição</label>
            <textarea id="desc" data-next="interns"></textarea>
          </div>

          <div class="field">
            <label>Internos</label>
            <textarea id="interns" data-next="endTime"></textarea>
          </div>

          <div class="grid2">
            <div class="field">
              <label>Hora final</label>
              <div class="rowNow">
                <input id="endTime" type="time" value="" data-next="launchBtn" />
                <button class="nowBtn" id="nowEnd" type="button">AGORA</button>
              </div>
            </div>
            <div class="field">
              <label>Tempo</label>
              <input id="duration" type="text" readonly value="00:00" />
            </div>
          </div>

          <div class="actions">
            <button id="launchBtn" class="btn green" type="button">LANÇAR OC</button>
            <button id="repeatBtn" class="btn" type="button">REPETIR</button>
          </div>
        </div>

        <div class="card">
          <div class="cardTitle">PLANTÃO</div>
          <div class="status">
            <span class="statusDot"></span>
            <span>PLANTÃO ATIVO</span>
            <span id="closedBadge" class="hidden">ENCERRADO</span>
          </div>
          <div style="height:8px"></div>
          <button id="configBtn" class="btn full" type="button">CONFIGURAR PLANTÃO</button>
          <div style="height:8px"></div>
          <button id="closePlantaoBtn" class="btn full danger" type="button">ENCERRAR PLANTÃO</button>
          <div style="height:8px"></div>
          <button id="newDayBtn" class="btn full" type="button">NOVO DIA</button>
        </div>
      </aside>

      <section class="right">
        <div class="bookShell">
          <div class="bookHeader">
            <div class="bookTitle">LIVRO DIÁRIO DE OCORRÊNCIAS<small>REGISTRO DO PLANTÃO</small></div>
            <div class="bookTools">
              <button id="copyDayBtn" type="button">COPIAR DIA</button>
              <button id="saveDayTxtBtn" type="button">SALVAR TXT</button>
            </div>
          </div>
          <div class="bookScroll" id="bookScroll">
            <div class="paper">
              <div class="paperHeader">
                <strong>Livro diário de ocorrências</strong>
                <small>Registro oficial do plantão</small>
              </div>
              <div id="openingText" class="opening" contenteditable="true" spellcheck="false"></div>
              <div id="entries"></div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="configModal" class="modal" aria-hidden="true">
    <div class="modalBox">
      <div class="modalTitle">CONFIGURAÇÃO DO PLANTÃO</div>
      <div class="grid2">
        <div class="field">
          <label>Mês</label>
          <input id="cfgMesario" type="text" value="CAIO ROCHA" data-next="cfgSuperior" />
        </div>
        <div class="field">
          <label>Superior</label>
          <input id="cfgSuperior" type="text" value="GERINALDO" data-next="qA" />
        </div>
      </div>

      <div class="cardTitle" style="margin-top: 14px;">QUANTITATIVO DAS GALERIAS</div>
      <div class="qtyGrid">
        <div class="field"><label>A</label><input id="qA" type="number" value="283" data-next="qB" /></div>
        <div class="field"><label>B</label><input id="qB" type="number" value="313" data-next="qC" /></div>
        <div class="field"><label>C</label><input id="qC" type="number" value="190" data-next="qT" /></div>
        <div class="field"><label>T</label><input id="qT" type="number" value="35" data-next="qL" /></div>
        <div class="field"><label>L</label><input id="qL" type="number" value="4" data-next="qH" /></div>
        <div class="field"><label>H</label><input id="qH" type="number" value="0" data-next="qAL" /></div>
        <div class="field"><label>AL</label><input id="qAL" type="number" value="36" data-next="cfgSave" /></div>
      </div>

      <div class="modalActions">
        <button id="cancelConfig" class="btn" type="button">CANCELAR</button>
        <button id="saveConfig" class="btn green" type="button">SALVAR</button>
      </div>
    </div>
  </div>

  <div id="flashModal" class="flashModal" aria-hidden="true">
    <div class="flashWindow">
      <div class="flashHead">
        <div>
          <strong>OC FLASH</strong>
          <small>Modelos inteligentes</small>
        </div>
        <button id="flashClose" class="flashClose" type="button" aria-label="Fechar">×</button>
      </div>
      <div class="flashBody">
        <div id="flashModelList" class="modelList"></div>

        <div class="flashForm">
          <label for="flashModelName">Nome do modelo</label>
          <input id="flashModelName" type="text" placeholder="Ex.: Plantão 24h" />

          <label for="flashModelTemplate" style="margin-top:10px;">Texto do modelo</label>
          <textarea id="flashModelTemplate" placeholder="Digite o modelo..."></textarea>

          <div class="flashTools">
            <button id="saveFlashModel" class="btn green" type="button">SALVAR MODELO</button>
            <button id="clearFlashModel" class="btn" type="button">LIMPAR</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script>
    'use strict';

    const STORAGE_KEYS = {
      config: 'ocfast_config_v5',
      records: 'ocfast_records_v5',
      lastDraft: 'ocfast_lastDraft_v5',
      flashModels: 'ocfast_flash_models_v5'
    };

    const defaultConfig = {
      mesario: 'CAIO ROCHA',
      superior: 'GERINALDO',
      qty: { A: 283, B: 313, C: 190, T: 35, L: 4, H: 0, AL: 36 }
    };

    const defaultModels = [
      { id: 'std-01', name: 'Padronizado', template: 'OC - Informações gerais\n\nA: {A}\nB: {B}\nC: {C}\nT: {T}\nL: {L}\nH: {H}\nAL: {AL}\n\nConferir e registrar no livro.' },
      { id: 'std-02', name: 'Plantão noturno', template: 'OC - Plantão noturno\n\nMesário: {mesario}\nSuperior: {superior}\n\nA: {A} | B: {B} | C: {C}\nT: {T} | L: {L} | H: {H} | AL: {AL}\n\nRegistrar dados com clareza.' }
    ];

    let records = JSON.parse(localStorage.getItem(STORAGE_KEYS.records) || '[]');
    let config = JSON.parse(localStorage.getItem(STORAGE_KEYS.config) || 'null') || defaultConfig;
    let lastDraft = JSON.parse(localStorage.getItem(STORAGE_KEYS.lastDraft) || 'null') || {};
    let flashModels = JSON.parse(localStorage.getItem(STORAGE_KEYS.flashModels) || 'null') || defaultModels;

    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => Array.from(document.querySelectorAll(sel));

    function pad2(v) {
      return String(v || 0).padStart(2, '0');
    }

    function nowTime() {
      const d = new Date();
      return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    }

    function formatDateForInput(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function toast(msg) {
      const el = $('#toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => el.classList.remove('show'), 2200);
    }

    function persistConfig() {
      localStorage.setItem(STORAGE_KEYS.config, JSON.stringify(config));
    }

    function persistRecords() {
      localStorage.setItem(STORAGE_KEYS.records, JSON.stringify(records));
    }

    function persistModels() {
      localStorage.setItem(STORAGE_KEYS.flashModels, JSON.stringify(flashModels));
    }

    function updateClock() {
      const d = new Date();
      $('#clock').textContent = `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
      $('#topDate').textContent = `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}/${d.getFullYear()}`;
    }

    function openConfigModal() {
      $('#cfgMesario').value = config.mesario || '';
      $('#cfgSuperior').value = config.superior || '';
      const qty = config.qty || defaultConfig.qty;
      ['A','B','C','T','L','H','AL'].forEach((key) => {
        const field = $(`#q${key}`);
        if (field) field.value = qty[key] ?? 0;
      });
      $('#configModal').classList.add('show');
      $('#configModal').setAttribute('aria-hidden', 'false');
    }

    function closeModal(id) {
      const el = document.getElementById(id);
      if (!el) return;
      el.classList.remove('show');
      el.setAttribute('aria-hidden', 'true');
    }

    function saveConfig() {
      config.mesario = $('#cfgMesario').value.trim() || defaultConfig.mesario;
      config.superior = $('#cfgSuperior').value.trim() || defaultConfig.superior;
      config.qty = {};
      ['A','B','C','T','L','H','AL'].forEach((key) => {
        config.qty[key] = Number($(`#q${key}`).value) || 0;
      });
      persistConfig();
      closeModal('configModal');
      toast('Configuração salva.');
    }

    function syncOpening() {
      const opening = $('#openingText');
      const text = [
        `OC - Comunicação do plantão`,
        `Mesário: ${config.mesario || 'NÃO INFORMADO'}`,
        `Superior: ${config.superior || 'NÃO INFORMADO'}`,
        '',
        `A: ${config.qty?.A ?? 0}`,
        `B: ${config.qty?.B ?? 0}`,
        `C: ${config.qty?.C ?? 0}`,
        `T: ${config.qty?.T ?? 0}`,
        `L: ${config.qty?.L ?? 0}`,
        `H: ${config.qty?.H ?? 0}`,
        `AL: ${config.qty?.AL ?? 0}`,
        '',
        'Ajustes do plantão em uso.'
      ].join('\n');

      if (!lastDraft.opening || !opening.textContent.trim()) opening.textContent = text;
      else opening.textContent = lastDraft.opening || text;
    }

    function saveDraft() {
      lastDraft = {
        opening: $('#openingText').textContent.trim(),
        startTime: $('#startTime').value,
        endTime: $('#endTime').value,
        date: $('#dateInput').value,
        service: $('#service').value,
        gallery: $('#gallery').value,
        monitors: $('#monitors').value,
        lawyer: $('#lawyer').value,
        oab: $('#oab').value,
        course: $('#course').value,
        desc: $('#desc').value,
        interns: $('#interns').value
      };
      localStorage.setItem(STORAGE_KEYS.lastDraft, JSON.stringify(lastDraft));
    }

    function restoreDraft() {
      if (!lastDraft) return;
      $('#startTime').value = lastDraft.startTime || '';
      $('#endTime').value = lastDraft.endTime || '';
      $('#dateInput').value = lastDraft.date || formatDateForInput();
      $('#service').value = lastDraft.service || 'vasilhames';
      $('#gallery').value = lastDraft.gallery || '';
      $('#monitors').value = lastDraft.monitors || '';
      $('#lawyer').value = lastDraft.lawyer || '';
      $('#oab').value = lastDraft.oab || '';
      $('#course').value = lastDraft.course || '';
      $('#desc').value = lastDraft.desc || '';
      $('#interns').value = lastDraft.interns || '';
      if (lastDraft.opening) $('#openingText').textContent = lastDraft.opening;
      else syncOpening();
    }

    function setDurationDisplay() {
      const start = $('#startTime').value;
      const end = $('#endTime').value;
      const durationEl = $('#duration');
      if (!start || !end) {
        durationEl.value = '00:00';
        return;
      }

      const [h1, m1] = start.split(':').map(Number);
      const [h2, m2] = end.split(':').map(Number);
      const startMin = h1 * 60 + m1;
      const endMin = h2 * 60 + m2;
      let diff = endMin - startMin;
      if (diff < 0) diff += 24 * 60;
      const totalMinutes = Math.max(diff, 0);
      const hours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;
      durationEl.value = `${pad2(hours)}:${pad2(minutes)}`;
    }

    function makeRecordText() {
      const text = [
        `OC - ${$('#service').value || 'serviço'}`,
        `Data: ${$('#dateInput').value || formatDateForInput()}`,
        `Hora inicial: ${$('#startTime').value || '--:--'}`,
        `Hora final: ${$('#endTime').value || '--:--'}`,
        `Galeria: ${$('#gallery').value || 'N/A'}`,
        `Monitores: ${$('#monitors').value || 'N/A'}`,
        `Advogado: ${$('#lawyer').value || 'N/A'}`,
        `OAB: ${$('#oab').value || 'N/A'}`,
        `Local/Curso: ${$('#course').value || 'N/A'}`,
        `Descrição: ${$('#desc').value || 'N/A'}`,
        `Internos: ${$('#interns').value || 'N/A'}`,
        '',
        `Registro: ${$('#openingText').textContent || 'Sem observação inicial.'}`
      ].join('\n');
      return text;
    }

    function renderRecords() {
      const entries = $('#entries');
      entries.innerHTML = '';
      if (!records.length) {
        const empty = document.createElement('div');
        empty.className = 'entry';
        empty.innerHTML = '<div class="entryText">Nenhuma ocorrência registrada ainda.</div>';
        entries.appendChild(empty);
        return;
      }

      records.forEach((rec, index) => {
        const entry = document.createElement('article');
        entry.className = 'entry';
        entry.id = `record-${index}`;

        const text = document.createElement('div');
        text.className = 'entryText';
        text.contentEditable = 'true';
        text.spellcheck = false;
        text.textContent = rec.text;
        text.addEventListener('blur', () => {
          records[index].text = text.textContent.trim() || rec.text;
          persistRecords();
        });

        const actions = document.createElement('div');
        actions.className = 'entryActions';

        const copyBtn = document.createElement('button');
        copyBtn.type = 'button';
        copyBtn.textContent = 'COPIAR';
        copyBtn.onclick = () => {
          navigator.clipboard.writeText(rec.text).then(() => toast('Ocorrência copiada.'));
        };

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.textContent = 'EXCLUIR';
        delBtn.onclick = () => {
          if (confirm('Excluir esta ocorrência?')) {
            records.splice(index, 1);
            persistRecords();
            renderRecords();
            toast('Ocorrência excluída.');
          }
        };

        actions.appendChild(copyBtn);
        actions.appendChild(delBtn);
        entry.appendChild(text);
        entry.appendChild(actions);
        entries.appendChild(entry);
      });
    }

    function launch() {
      const start = $('#startTime').value.trim();
      const date = $('#dateInput').value.trim();
      if (!start && !date) {
        toast('Preencha pelo menos a hora inicial e a data.');
        $('#startTime').focus();
        return;
      }

      const record = {
        text: makeRecordText(),
        createdAt: new Date().toISOString()
      };
      records.push(record);
      persistRecords();
      renderRecords();
      saveDraft();
      toast('OC lançada.');
      $('#startTime').value = '';
      $('#endTime').value = '';
      $('#duration').value = '00:00';
    }

    function repeatLast() {
      if (!records.length) {
        toast('Não há uma OC anterior para repetir.');
        return;
      }
      const last = records[records.length - 1];
      records.push({ ...last, createdAt: new Date().toISOString() });
      persistRecords();
      renderRecords();
      toast('Última OC repetida.');
    }

    function copyDay() {
      const text = `${$('#openingText').textContent}\n\n${records.map(r => r.text).join('\n\n')}`;
      navigator.clipboard.writeText(text).then(() => toast('Livro do dia copiado.'));
    }

    function saveDayTxt() {
      const text = `${$('#openingText').textContent}\n\n${records.map(r => r.text).join('\n\n')}`;
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `oc-fast-${formatDateForInput()}.txt`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      toast('Arquivo TXT salvo.');
    }

    function newDay() {
      if (!confirm('Iniciar um novo dia irá limpar o registro atual?')) return;
      records = [];
      persistRecords();
      renderRecords();
      $('#openingText').textContent = '';
      saveDraft();
      toast('Novo dia iniciado.');
    }

    function setNow(id) {
      const field = document.getElementById(id);
      if (field) field.value = nowTime();
      setDurationDisplay();
      saveDraft();
    }

    function handleEnterNavigation(e) {
      if (e.key !== 'Enter' || e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
      const target = e.target;
      if (!(target instanceof HTMLElement)) return;
      if (target.tagName === 'SELECT' || target.tagName === 'TEXTAREA') {
        if (target.tagName === 'SELECT' && target.matches(':focus')) return;
      }
      if (target.matches('button')) return;
      if (target.matches('input[type="time"]')) {
        e.preventDefault();
      }
      const nextId = target.dataset.next;
      if (!nextId) return;
      const nextEl = document.getElementById(nextId);
      if (!nextEl) return;
      e.preventDefault();
      nextEl.focus();
      if (nextEl.tagName === 'SELECT') nextEl.dispatchEvent(new Event('focus'));
    }

    function setupQuickTimePicker(inputId) {
      const input = document.getElementById(inputId);
      if (!input) return;
      const wrapper = document.createElement('div');
      wrapper.className = 'quickTimePicker hidden';
      wrapper.innerHTML = `
        <div class="quickTimePart">
          <label class="quickTimeLabel">Hora</label>
          <select class="time-hour" aria-label="Hora"></select>
        </div>
        <div class="quickTimePart">
          <label class="quickTimeLabel">Min.</label>
          <select class="time-minute" aria-label="Minutos"></select>
        </div>
      `;
      input.parentNode.insertBefore(wrapper, input.nextSibling);

      const hourSelect = wrapper.querySelector('.time-hour');
      const minuteSelect = wrapper.querySelector('.time-minute');
      for (let hour = 0; hour < 24; hour++) {
        const option = document.createElement('option');
        option.value = String(hour).padStart(2, '0');
        option.textContent = String(hour).padStart(2, '0');
        hourSelect.appendChild(option);
      }
      for (let minute = 0; minute < 60; minute += 5) {
        const option = document.createElement('option');
        option.value = String(minute).padStart(2, '0');
        option.textContent = String(minute).padStart(2, '0');
        minuteSelect.appendChild(option);
      }

      const openPicker = () => {
        wrapper.classList.remove('hidden');
        const val = input.value || '00:00';
        const [h, m] = val.split(':');
        hourSelect.value = h || '00';
        minuteSelect.value = m || '00';
        setTimeout(() => hourSelect.focus(), 40);
      };

      const applyCurrentPicker = () => {
        const h = hourSelect.value;
        const m = minuteSelect.value;
        input.value = `${h}:${m}`;
        wrapper.classList.add('hidden');
        setDurationDisplay();
        saveDraft();
      };

      hourSelect.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          minuteSelect.focus();
        }
      });
      minuteSelect.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          applyCurrentPicker();
        }
      });

      hourSelect.addEventListener('change', () => {
        if (hourSelect.value && minuteSelect.value) applyCurrentPicker();
      });
      minuteSelect.addEventListener('change', () => {
        if (hourSelect.value && minuteSelect.value) applyCurrentPicker();
      });

      input.addEventListener('focus', openPicker);
      input.addEventListener('click', openPicker);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          openPicker();
        }
      });
    }

    function renderFlashModels() {
      const list = $('#flashModelList');
      list.innerHTML = '';

      if (!flashModels.length) {
        const empty = document.createElement('div');
        empty.className = 'modelCardItem';
        empty.innerHTML = '<strong>Nenhum modelo salvo</strong><small>Salve o modelo atual para reutilizar.</small>';
        list.appendChild(empty);
        return;
      }

      flashModels.forEach((model) => {
        const card = document.createElement('div');
        card.className = 'modelCardItem';
        card.innerHTML = `
          <strong>${model.name}</strong>
          <small>${model.template.slice(0, 60).replace(/\n/g, ' ')}${model.template.length > 60 ? '...' : ''}</small>
          <div class="modelCardActions">
            <button type="button" data-load="${model.id}">CARREGAR</button>
            <button type="button" data-rename="${model.id}">RENOMEAR</button>
            <button type="button" class="danger" data-delete="${model.id}">EXCLUIR</button>
          </div>
        `;
        list.appendChild(card);
      });

      list.querySelectorAll('[data-load]').forEach((button) => {
        button.addEventListener('click', () => {
          const model = flashModels.find((m) => m.id === button.dataset.load);
          if (!model) return;
          const hasContent = $('#openingText').textContent.trim();
          if (hasContent && !confirm('Já existe conteúdo no texto atual. Carregar o modelo sobrescreverá?')) return;
          $('#flashModelName').value = model.name;
          $('#flashModelTemplate').value = model.template;
          toast(`Modelo "${model.name}" carregado.`);
        });
      });

      list.querySelectorAll('[data-rename]').forEach((button) => {
        button.addEventListener('click', () => {
          const model = flashModels.find((m) => m.id === button.dataset.rename);
          if (!model) return;
          const nextName = prompt('Novo nome do modelo:', model.name);
          if (!nextName) return;
          model.name = nextName.trim() || model.name;
          persistModels();
          renderFlashModels();
          toast('Modelo renomeado.');
        });
      });

      list.querySelectorAll('[data-delete]').forEach((button) => {
        button.addEventListener('click', () => {
          const model = flashModels.find((m) => m.id === button.dataset.delete);
          if (!model) return;
          if (!confirm(`Excluir o modelo "${model.name}"?`)) return;
          flashModels = flashModels.filter((m) => m.id !== model.id);
          persistModels();
          renderFlashModels();
          toast('Modelo excluído.');
        });
      });
    }

    function saveFlashModel() {
      const name = $('#flashModelName').value.trim();
      const template = $('#flashModelTemplate').value.trim();
      if (!name || !template) {
        toast('Informe nome e texto do modelo.');
        return;
      }

      const existing = flashModels.find((m) => m.name.toLowerCase() === name.toLowerCase());
      if (existing) {
        existing.template = template;
        existing.updatedAt = Date.now();
        persistModels();
        renderFlashModels();
        toast('Modelo atualizado.');
        return;
      }

      flashModels.push({
        id: `model-${Date.now()}`,
        name,
        template,
        updatedAt: Date.now()
      });
      persistModels();
      renderFlashModels();
      toast('Modelo salvo.');
    }

    function clearFlashForm() {
      $('#flashModelName').value = '';
      $('#flashModelTemplate').value = '';
    }

    function openFlashModal() {
      renderFlashModels();
      $('#flashModal').classList.add('show');
      $('#flashModal').setAttribute('aria-hidden', 'false');
    }

    function closeFlashModal() {
      $('#flashModal').classList.remove('show');
      $('#flashModal').setAttribute('aria-hidden', 'true');
    }

    function applyModelToEditor() {
      const template = $('#flashModelTemplate').value.trim();
      if (!template) return;
      $('#openingText').textContent = template;
      saveDraft();
      toast('Modelo aplicado ao texto.');
    }

    function init() {
      updateClock();
      setInterval(updateClock, 1000);

      $('#dateInput').value = formatDateForInput();
      restoreDraft();
      syncOpening();
      renderRecords();
      persistConfig();
      renderFlashModels();

      $('#openConfigBtn')?.addEventListener('click', openConfigModal);
      $('#configBtn').addEventListener('click', openConfigModal);
      $('#saveConfig').addEventListener('click', saveConfig);
      $('#cancelConfig').addEventListener('click', () => closeModal('configModal'));
      $('#closePlantaoBtn').addEventListener('click', () => {
        $('#closedBadge').classList.remove('hidden');
        toast('Plantão encerrado.');
      });
      $('#newDayBtn').addEventListener('click', newDay);
      $('#launchBtn').addEventListener('click', launch);
      $('#repeatBtn').addEventListener('click', repeatLast);
      $('#copyDayBtn').addEventListener('click', copyDay);
      $('#saveDayTxtBtn').addEventListener('click', saveDayTxt);
      $('#nowStart').addEventListener('click', () => setNow('startTime'));
      $('#nowEnd').addEventListener('click', () => setNow('endTime'));
      $('#openingText').addEventListener('input', saveDraft);
      ['startTime', 'endTime', 'dateInput', 'service', 'gallery', 'monitors', 'lawyer', 'oab', 'course', 'desc', 'interns'].forEach((id) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('input', saveDraft);
        el.addEventListener('change', saveDraft);
      });
      $('#cfgMesario').addEventListener('keydown', handleEnterNavigation);
      $('#cfgSuperior').addEventListener('keydown', handleEnterNavigation);
      ['qA','qB','qC','qT','qL','qH','qAL'].forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('keydown', handleEnterNavigation);
      });
      $('#configModal').addEventListener('click', (e) => {
        if (e.target === $('#configModal')) closeModal('configModal');
      });

      $('#fsBtn').addEventListener('click', () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
        else document.exitFullscreen?.();
      });
      $('#minBtn').addEventListener('click', () => toast('Minimizar ativado no ambiente desktop.'));
      $('#closeBtn').addEventListener('click', () => toast('O navegador decide o fechamento.'));

      setupQuickTimePicker('startTime');
      setupQuickTimePicker('endTime');

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          closeModal('configModal');
          closeFlashModal();
        }
        if ((event.code === 'Space' || event.key === ' ') && !event.target.matches('input, textarea, select')) {
          event.preventDefault();
          $('#startTime').focus();
        }
      });

      document.addEventListener('keydown', handleEnterNavigation);
      $('#saveFlashModel').addEventListener('click', saveFlashModel);
      $('#clearFlashModel').addEventListener('click', clearFlashForm);
      $('#ocFlashBtn').addEventListener('click', openFlashModal);
      $('#flashClose').addEventListener('click', closeFlashModal);
      $('#flashModal').addEventListener('click', (e) => {
        if (e.target === $('#flashModal')) closeFlashModal();
      });

      $('#flashModelTemplate').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
          e.preventDefault();
          applyModelToEditor();
        }
      });

      $('#saveConfig').addEventListener('click', saveConfig);
      $('#cancelConfig').addEventListener('click', () => closeModal('configModal'));
      $('#startTime').addEventListener('input', setDurationDisplay);
      $('#endTime').addEventListener('input', setDurationDisplay);
      setDurationDisplay();
      window.addEventListener('beforeunload', saveDraft);
    }

    init();
  </script>
</body>
</html>
